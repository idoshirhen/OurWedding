<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>חידון החתונה של עדן ועידו</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap');
        
        :root {
            --primary: #d8b4fe;
            --primary-dark: #a78bfa;
            --secondary: #f3e8ff;
            --dark: #4c1d95;
            --light: #ffffff;
            --correct: #bbf7d0;
            --wrong: #fecaca;
            --accent: #f472b6;
            --screen-height: 100dvh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: var(--screen-height);
            overflow: hidden; /* מונע גלילה לחלוטין */
            position: fixed; /* מקבע את הדף למניעת משיכה באייפון */
        }

        body {
            font-family: 'Heebo', sans-serif;
            /* רקע משופר למניעת שבירה */
            background: linear-gradient(180deg, #1a1033 0%, #4c1d95 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
        }

        .bg-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.15;
            animation: move 15s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-30%, -30%); }
            to { transform: translate(30%, 30%); }
        }

        .container {
            width: 90%;
            height: 85%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* אנימציות */
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* כותרות */
        .welcome-header { text-align: center; margin-bottom: 1.5rem; }
        
        .main-title {
            font-weight: 900;
            font-size: 2.6rem;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap; /* שורה אחת */
        }

        .sub-title {
            font-weight: 700;
            font-size: 1.8rem; /* מוגדל */
            margin-top: 5px;
            color: var(--primary);
        }

        /* שאלות */
        .question {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.2;
        }

        .option {
            background: rgba(255, 255, 255, 0.18); /* יותר בולט */
            border: 1px solid rgba(255, 255, 255, 0.4); /* גבול מודגש */
            padding: 1.1rem;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 600;
            transition: all 0.2s;
            text-align: right;
            margin-bottom: 0.8rem;
        }

        .option.correct { background: var(--correct); color: #065f46; border-color: #059669; }
        .option.wrong { background: var(--wrong); color: #991b1b; border-color: #dc2626; }

        .btn {
            background: var(--light);
            color: var(--dark);
            border: none;
            padding: 1.1rem;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 20px;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:disabled { opacity: 0; pointer-events: none; }

        .progress-bar {
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .hidden { display: none !important; }

        @media (max-height: 660px) {
            .main-title { font-size: 2.1rem; }
            .sub-title { font-size: 1.5rem; }
            .container { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="bg-blob"></div>

    <div class="container fade-in" id="welcome-section">
        <div class="welcome-header">
            <h1 class="main-title">חידון החתונה</h1>
            <p class="sub-title">של עדן ועידו</p>
        </div>
        
        <div style="text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🤵❤️👰</div>
            <p style="font-size: 1.5rem; font-weight: 800;">מוכנים לבדוק את זה? 🔥</p>
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 1.5rem; font-size: 1.8rem;">
                <span>💍</span><span>🥂</span><span>🎊</span>
            </div>
        </div>

        <div style="margin-top: auto;">
            <button class="btn" id="start-btn">בואו נתחיל ✨</button>
        </div>
    </div>

    <div class="container hidden" id="quiz-section">
        <div style="margin-bottom: 1.5rem;">
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; font-weight: 600;">
                <span id="current-count">שאלה 1</span>
                <span>מתוך 10</span>
            </div>
            <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px;">
                <div class="progress-bar" id="progress" style="width: 10%;"></div>
            </div>
        </div>

        <div id="quiz-content" style="flex-grow: 1;">
            <div class="question" id="question-text"></div>
            <div id="options-container"></div>
        </div>

        <div style="margin-top: auto; min-height: 80px; display: flex; align-items: center;">
            <button class="btn" id="next-btn" disabled>השאלה הבאה ◀️</button>
            <button class="btn hidden" id="submit-btn">סיום וסיכום 🏆</button>
        </div>
    </div>

    <div class="container hidden" id="results-section">
        <h1 class="main-title">התוצאה!</h1>
        <div style="text-align: center; margin: auto 0;">
            <div id="perfect-trophy" class="hidden" style="font-size: 4rem;">👑</div>
            <div style="font-size: 1.2rem; opacity: 0.8;">הציון שלכם:</div>
            <div id="final-score" style="font-size: 5rem; font-weight: 900; color: var(--primary);">0/10</div>
            <p id="result-message" style="font-size: 1.4rem; font-weight: 700; padding: 0 1rem;"></p>
        </div>
        <button class="btn" id="restart-btn" style="margin-top: auto;">נסה שוב 🔄</button>
    </div>

    <script>
        const questions = [
            { question: "מתי עדן ועידו הכירו?", options: ["2020", "2021", "2022"], answer: 1 },
            { question: "איפה עדן ועידו הכירו?", options: ["דרך חברים", "בעבודה", "באפליקצית היכרות"], answer: 1 },
            { question: "מה התחביב מספר 1 של עידו?", options: ["צילום", "כדורגל", "מחשב"], answer: 1 },
            { question: "מה התחביב מספר 1 של עדן?", options: ["לקרוא ספרים", "לצייר", "לנקות"], answer: 0 },
            { question: "מה היה המקום של הדייט הראשון?", options: ["בר", "פארק", "פיצה ברחוב"], answer: 0 },
            { question: "מה הדבר הראשון שעדן כתבה לעידו בווטסאפ?", options: ["עידו זאת עדן רוצה מים?", "היי זאת עדן מהעבודה", "מה קורה? אתה הצלם?"], answer: 0 },
            { question: "לאן הם טסו לראשונה יחד?", options: ["פראג", "פריז", "טורקיה"], answer: 1 },
            { question: "מה עדן אמרה כשעידו הציע לה נישואין?", options: ["מאמי? מה זה??", "מה אתה עושה??", "ברורררר !!!"], answer: 0 },
            { question: "מי מבני הזוג נרדם ראשון?", options: ["עדן", "עידו"], answer: 1 },
            { question: "מי יותר עצבני כשהוא רעב?", options: ["עדן", "עידו"], answer: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;

        const welcomeSection = document.getElementById('welcome-section');
        const quizSection = document.getElementById('quiz-section');
        const resultsSection = document.getElementById('results-section');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');

        document.getElementById('start-btn').onclick = () => {
            welcomeSection.classList.add('hidden');
            quizSection.classList.remove('hidden');
            loadQuestion();
        };

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('current-count').textContent = `שאלה ${currentQuestion + 1}`;
            document.getElementById('progress').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            document.getElementById('question-text').textContent = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option fade-in';
                div.textContent = opt;
                div.onclick = () => checkAnswer(i, div);
                container.appendChild(div);
            });
            
            nextBtn.disabled = true;
        }

        function checkAnswer(idx, el) {
            const q = questions[currentQuestion];
            const opts = document.querySelectorAll('.option');
            opts.forEach(o => o.style.pointerEvents = 'none');

            if (idx === q.answer) {
                el.classList.add('correct');
                el.innerHTML += ' ✨';
                score++;
            } else {
                el.classList.add('wrong');
                el.innerHTML += ' ❌';
                opts[q.answer].classList.add('correct');
            }

            if (currentQuestion < questions.length - 1) {
                nextBtn.disabled = false;
            } else {
                submitBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            loadQuestion();
        };

        submitBtn.onclick = () => {
            quizSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            const msg = document.getElementById('result-message');
            if(score === 10) {
                msg.textContent = "מושלם! אתם מכירים אותם הכי טוב שיש! 😍";
                document.getElementById('perfect-trophy').classList.remove('hidden');
            } else if(score >= 7) {
                msg.textContent = "מצוין! אתם חברים קרובים מאוד! ✨";
            } else {
                msg.textContent = "חמוד, אבל אולי כדאי לשבת איתם לקפה... 🥂";
            }
        };

        document.getElementById('restart-btn').onclick = () => location.reload();
    </script>
</body>
</html>
