<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>חידון החתונה של עידו ועדן</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&family=Assistant:wght@300;600&display=swap');
        
        :root {
            --primary: #d8b4fe;
            --primary-dark: #a78bfa;
            --secondary: #f3e8ff;
            --dark: #4c1d95;
            --light: #ffffff;
            --correct: #bbf7d0;
            --wrong: #fecaca;
            --accent: #f472b6;
            --screen-height: 100dvh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--secondary);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            height: var(--screen-height);
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
        }

        /* בועות רקע זזות */
        .bg-blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--primary);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .container {
            width: 92%;
            height: 85%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            padding: 2.5rem 1.5rem;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* אנימציות מעבר */
        .fade-in { animation: fadeIn 0.6s forwards; }
        .slide-out { animation: slideOut 0.4s forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes slideOut {
            to { opacity: 0; transform: translateX(50px); }
        }

        /* כותרות */
        .main-title {
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: -1px;
            background: linear-gradient(to bottom right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            line-height: 1;
        }

        .sub-title {
            font-weight: 300;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 0.5rem;
            opacity: 0.8;
        }

        /* התקדמות */
        .progress-wrapper {
            margin-bottom: 2rem;
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* שאלות ותשובות */
        .question {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-align: center;
            line-height: 1.2;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .option {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option:hover { background: rgba(255, 255, 255, 0.1); }
        .option:active { transform: scale(0.98); }

        .option.correct { 
            background: var(--correct); 
            color: #065f46; 
            border-color: #059669;
            font-weight: 700;
        }
        
        .option.wrong { 
            background: var(--wrong); 
            color: #991b1b; 
            border-color: #dc2626;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* כפתורים */
        .action-area {
            margin-top: auto;
            padding-top: 1.5rem;
            min-height: 80px;
        }

        .btn {
            background: var(--light);
            color: var(--dark);
            border: none;
            padding: 1.2rem;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .btn:disabled { opacity: 0; pointer-events: none; }

        .hidden { display: none !important; }

        /* אייקונים מיוחדים */
        .floating-heart {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 10px var(--accent));
            animation: heartBeat 1.5s infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }

    </style>
</head>
<body>
    <div class="bg-blob"></div>

    <!-- מסך פתיחה -->
    <div class="container fade-in" id="welcome-section">
        <div style="text-align: center;">
            <div class="floating-heart">❤️</div>
            <h1 class="main-title">חידון<br>החתונה</h1>
            <p class="sub-title">של עידו ועדן</p>
        </div>
        
        <div style="text-align: center; margin-top: 2rem;">
            <p style="font-weight: 600; opacity: 0.9;">מוכנים לבדוק את הידע?</p>
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 1rem; font-size: 1.5rem;">
                <span>💍</span><span>🥂</span><span>🎊</span>
            </div>
        </div>

        <div class="action-area">
            <button class="btn" id="start-btn">בואו נתחיל ✨</button>
        </div>
    </div>

    <!-- מסך חידון -->
    <div class="container hidden" id="quiz-section">
        <div class="progress-wrapper">
            <div class="progress-info">
                <span id="current-count">שאלה 1</span>
                <span id="total-count">מתוך 10</span>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>
        </div>

        <div id="quiz-content">
            <div class="question" id="question-text"></div>
            <div class="options" id="options-container"></div>
        </div>

        <div class="action-area">
            <button class="btn" id="next-btn" disabled>הבא ◀️</button>
            <button class="btn hidden" id="submit-btn">סיום וסיכום 🏆</button>
        </div>
    </div>

    <!-- מסך תוצאות -->
    <div class="container hidden" id="results-section">
        <h1 class="main-title">סיכום</h1>
        <div style="text-align: center; margin: 2rem 0;">
            <div id="perfect-trophy" class="hidden" style="font-size: 4rem;">👑</div>
            <div style="font-size: 1.1rem; opacity: 0.7;">הציון שלכם:</div>
            <div id="final-score" style="font-size: 5rem; font-weight: 900; color: var(--primary);">0/10</div>
            <p id="result-message" style="font-size: 1.3rem; font-weight: 600; padding: 0 1rem;"></p>
        </div>

        <div class="action-area">
            <button class="btn" id="restart-btn">סיבוב נוסף 🔄</button>
        </div>
    </div>

    <script>
        const questions = [
            { question: "מתי עדן ועידו הכירו?", options: ["2020", "2021", "2022"], answer: 1 },
            { question: "איפה עדן ועידו הכירו?", options: ["דרך חברים", "בעבודה", "באפליקצית היכרות"], answer: 1 },
            { question: "מה התחביב מספר 1 של עידו?", options: ["צילום", "כדורגל", "מחשב"], answer: 1 },
            { question: "מה התחביב מספר 1 של עדן?", options: ["לקרוא ספרים", "לצייר", "לנקות"], answer: 0 },
            { question: "מה היה המקום של הדייט הראשון?", options: ["בר", "פארק", "פיצה ברחוב"], answer: 0 },
            { question: "מה הדבר הראשון שעדן כתבה לעידו בווטסאפ?", options: ["עידו זאת עדן רוצה מים?", "היי זאת עדן מהעבודה", "מה קורה? אתה הצלם?"], answer: 0 },
            { question: "לאן הם טסו לראשונה יחד?", options: ["פראג", "פריז", "טורקיה"], answer: 1 },
            { question: "מה עדן אמרה כשעידו הציע לה נישואין?", options: ["מאמי? מה זה??", "מה אתה עושה??", "ברורררר !!!"], answer: 0 },
            { question: "מי מבני הזוג נרדם ראשון?", options: ["עדן", "עידו"], answer: 1 },
            { question: "מי יותר עצבני כשהוא רעב?", options: ["עדן", "עידו"], answer: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;

        const welcomeSection = document.getElementById('welcome-section');
        const quizSection = document.getElementById('quiz-section');
        const resultsSection = document.getElementById('results-section');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');

        document.getElementById('start-btn').onclick = () => {
            welcomeSection.classList.add('slide-out');
            setTimeout(() => {
                welcomeSection.classList.add('hidden');
                quizSection.classList.remove('hidden');
                quizSection.classList.add('fade-in');
                loadQuestion();
            }, 400);
        };

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('current-count').textContent = `שאלה ${currentQuestion + 1}`;
            document.getElementById('progress').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            document.getElementById('question-text').textContent = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option fade-in';
                div.style.animationDelay = `${i * 0.1}s`;
                div.textContent = opt;
                div.onclick = () => checkAnswer(i, div);
                optionsContainer.appendChild(div);
            });
            
            nextBtn.disabled = true;
        }

        function checkAnswer(idx, el) {
            const q = questions[currentQuestion];
            const allOptions = document.querySelectorAll('.option');
            allOptions.forEach(opt => opt.style.pointerEvents = 'none');

            if (idx === q.answer) {
                el.classList.add('correct');
                el.innerHTML += ' <span>✨</span>';
                score++;
            } else {
                el.classList.add('wrong');
                el.innerHTML += ' <span>❌</span>';
                allOptions[q.answer].classList.add('correct');
            }

            if (currentQuestion < questions.length - 1) {
                nextBtn.disabled = false;
            } else {
                submitBtn.classList.remove('hidden');
            }
        }

        nextBtn.onclick = () => {
            currentQuestion++;
            const content = document.getElementById('quiz-content');
            content.style.opacity = '0';
            setTimeout(() => {
                loadQuestion();
                content.style.opacity = '1';
            }, 300);
        };

        submitBtn.onclick = () => {
            quizSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            resultsSection.classList.add('fade-in');
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            
            const msg = document.getElementById('result-message');
            if(score === 10) {
                msg.textContent = "פשוט מושלם! אתם מכירים אותם הכי טוב בעולם! 😍";
                document.getElementById('perfect-trophy').classList.remove('hidden');
            } else if(score >= 7) {
                msg.textContent = "מרשים מאוד! אתם חברים קרובים באמת ✨";
            } else {
                msg.textContent = "נחמד, אבל יש מקום להשלים פערים 🥂";
            }
        };

        document.getElementById('restart-btn').onclick = () => location.reload();
    </script>
</body>
</html>
