<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>חידון החתונה של עדן ועידו</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap');
        
        :root {
            --primary: #d8b4fe;
            --primary-dark: #a78bfa;
            --secondary: #f3e8ff;
            --dark: #4c1d95;
            --light: #ffffff;
            --correct: #bbf7d0;
            --wrong: #fecaca;
            --accent: #f472b6;
            /* גובה ברירת מחדל שיעודכן ע"י JS */
            --vh: 1vh;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: calc(var(--vh, 1vh) * 100);
            overflow: hidden;
            position: fixed;
            background: #1a1033;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(180deg, #1a1033 0%, #4c1d95 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--light);
            touch-action: none; /* מונע גלילה ומחוות דפדפן */
        }

        .container {
            width: 90%;
            height: 85%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            padding: 2rem 1.2rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .main-title {
            font-weight: 900;
            font-size: 2.4rem;
            background: linear-gradient(to bottom, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .sub-title {
            font-weight: 700;
            font-size: 1.7rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 1rem;
        }

        .question {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.2;
        }

        .option {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 1.1rem;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: right;
            margin-bottom: 0.8rem;
            color: white;
            transition: transform 0.1s;
        }

        .option.correct { background: var(--correct) !important; color: #065f46 !important; }
        .option.wrong { background: var(--wrong) !important; color: #991b1b !important; }

        .btn {
            background: var(--light);
            color: var(--dark);
            border: none;
            padding: 1.1rem;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 20px;
            width: 100%;
            cursor: pointer;
        }

        .btn:disabled { opacity: 0; pointer-events: none; }

        .progress-bar {
            height: 6px;
            background: var(--primary);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container fade-in" id="welcome-section">
        <h1 class="main-title">חידון החתונה</h1>
        <p class="sub-title">של עדן ועידו</p>
        
        <div style="text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
            <div style="font-size: 4rem;">🤵❤️👰</div>
            <p style="font-size: 1.4rem; font-weight: 800; margin-top: 1rem;">מוכנים לבדוק את זה? 🔥</p>
        </div>

        <button class="btn" id="start-btn">בואו נתחיל ✨</button>
    </div>

    <div class="container hidden" id="quiz-section">
        <div style="width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 1rem;">
            <div class="progress-bar" id="progress"></div>
        </div>
        <div id="quiz-content" style="flex-grow: 1;">
            <div class="question" id="question-text"></div>
            <div id="options-container"></div>
        </div>
        <div style="min-height: 80px; display: flex; align-items: center;">
            <button class="btn" id="next-btn" disabled>השאלה הבאה ◀️</button>
            <button class="btn hidden" id="submit-btn">סיום 🏆</button>
        </div>
    </div>

    <div class="container hidden" id="results-section">
        <h1 class="main-title">התוצאה!</h1>
        <div style="text-align: center; margin: auto 0;">
            <div id="final-score" style="font-size: 5rem; font-weight: 900;">0/10</div>
            <p id="result-message" style="font-size: 1.3rem; font-weight: 700;"></p>
        </div>
        <button class="btn" id="restart-btn">נסה שוב 🔄</button>
    </div>

    <script>
        // תיקון גובה למובייל
        function updateHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', updateHeight);
        updateHeight();

        const questions = [
            { question: "מתי עדן ועידו הכירו?", options: ["2020", "2021", "2022"], answer: 1 },
            { question: "איפה עדן ועידו הכירו?", options: ["דרך חברים", "בעבודה", "באפליקצית היכרות"], answer: 1 },
            { question: "מה התחביב מספר 1 של עידו?", options: ["צילום", "כדורגל", "מחשב"], answer: 1 },
            { question: "מה התחביב מספר 1 של עדן?", options: ["לקרוא ספרים", "לצייר", "לנקות"], answer: 0 },
            { question: "מה היה המקום של הדייט הראשון?", options: ["בר", "פארק", "פיצה ברחוב"], answer: 0 },
            { question: "מה הדבר הראשון שעדן כתבה לעידו בווטסאפ?", options: ["עידו זאת עדן רוצה מים?", "היי זאת עדן מהעבודה", "מה קורה? אתה הצלם?"], answer: 0 },
            { question: "לאן הם טסו לראשונה יחד?", options: ["פראג", "פריז", "טורקיה"], answer: 1 },
            { question: "מה עדן אמרה כשעידו הציע לה נישואין?", options: ["מאמי? מה זה??", "מה אתה עושה??", "ברורררר !!!"], answer: 0 },
            { question: "מי מבני הזוג נרדם ראשון?", options: ["עדן", "עידו"], answer: 1 },
            { question: "מי יותר עצבני כשהוא רעב?", options: ["עדן", "עידו"], answer: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;

        const welcomeSection = document.getElementById('welcome-section');
        const quizSection = document.getElementById('quiz-section');
        const resultsSection = document.getElementById('results-section');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');

        // פונקציית לחיצה אוניברסלית למובייל
        function bindClick(el, fn) {
            el.addEventListener('click', (e) => {
                e.preventDefault();
                fn();
            });
        }

        bindClick(document.getElementById('start-btn'), () => {
            welcomeSection.classList.add('hidden');
            quizSection.classList.remove('hidden');
            loadQuestion();
        });

        function loadQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('progress').style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
            document.getElementById('question-text').textContent = q.question;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.addEventListener('click', (e) => {
                    e.preventDefault();
                    checkAnswer(i, div);
                });
                container.appendChild(div);
            });
            nextBtn.disabled = true;
        }

        function checkAnswer(idx, el) {
            const q = questions[currentQuestion];
            const opts = document.querySelectorAll('.option');
            opts.forEach(o => o.style.pointerEvents = 'none');

            if (idx === q.answer) {
                el.classList.add('correct');
                score++;
            } else {
                el.classList.add('wrong');
                opts[q.answer].classList.add('correct');
            }

            if (currentQuestion < questions.length - 1) {
                nextBtn.disabled = false;
            } else {
                submitBtn.classList.remove('hidden');
                nextBtn.classList.add('hidden');
            }
        }

        bindClick(nextBtn, () => {
            currentQuestion++;
            loadQuestion();
        });

        bindClick(submitBtn, () => {
            quizSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score}/${questions.length}`;
            document.getElementById('result-message').textContent = score >= 7 ? "מצוין! אתם חברים קרובים מאוד! ✨" : "חמוד, אבל יש מה לשפר... 🥂";
        });

        bindClick(document.getElementById('restart-btn'), () => location.reload());
    </script>
</body>
</html>
